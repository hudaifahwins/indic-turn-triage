[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-triage"
version = "0.1.0"
description = "Deterministic triage for multilingual Indian (English/Hindi/Tamil) voice & chat agent failures: script drift, entity corruption, latency, outcome scoring, batch clustering, FastAPI dashboard."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "indic-triage team" }]
keywords = ["multilingual", "indic", "voice", "triage", "triage", "fastapi", "sqlite", "latency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Voice",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.29.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
indic-triage = "indic_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
